[project]
name = "dash-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrés Torres", email = "elfotografo007@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "dash>=4.5.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
dash-playground = "dash_playground:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
